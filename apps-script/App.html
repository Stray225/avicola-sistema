    // NUEVO / EN RUTA
    clienteNuevo: function () {
      var f = formActual();
      var q = String(f.busqueda || '').trim();
      f.etapaCliente = 'campos';
      if (q.replace(/\D/g, '').length >= 8) f.telefono = q; else if (q) f.nombre = q;
      f.busqueda = '';
      pintarBloque('bloque-cliente', htmlCliente(f));
      pintarAvisoTelefono();
    },
    cambiarCliente: function () {
      var f = formActual();
      f.etapaCliente = 'buscar'; f.clienteTel = ''; f.nombre = ''; f.telefono = '';
      f.direccion = ''; f.entreCalles = ''; f.barrio = ''; f.barrioOtro = ''; f.referencia = '';
      pintarBloque('bloque-cliente', htmlCliente(f));
    },
    elegirCliente: function (el) { elegirCliente(el.getAttribute('data-tel')); },
    repetir: repetirUltimo,
    mismaDir: function (el) {
      var f = formActual();
      f.mismaDireccion = el.getAttribute('data-v') === 'si';
      pintarBloque('bloque-cliente', htmlCliente(f));
      pintarAvisoBarrio();
    },
    mas: function (el) { cambiarCantidad(formActual(), el.getAttribute('data-codigo'), 1); },
    menos: function (el) { cambiarCantidad(formActual(), el.getAttribute('data-codigo'), -1); },
    quitar: function (el) {
      var f = formActual();
      var codigo = el.getAttribute('data-codigo');
      delete f.lineas[codigo];
      f.ordenLineas = f.ordenLineas.filter(function (c) { return c !== codigo; });
      var span = porDato('data-q', codigo);
      if (span) span.textContent = '0';
      var fila = porDato('data-prod', codigo);
      if (fila) fila.classList.remove('con');
      pintarBloque('bloque-resumen', htmlResumen(f));
    },
    usarSugerido: function () {
      var f = formActual();
      f.totalEditado = false;
      f.totalCobrado = '';
      pintarBloque('bloque-resumen', htmlResumen(f));
    },
    fecha: function (el) {
      var f = formActual();
      f.fechaEntrega = el.getAttribute('data-v');
      pintarBloque('bloque-entrega', htmlEntrega(f));
    },
    origen: function (el) {
      var f = formActual();
      var v = el.getAttribute('data-v');
      f.origen = f.origen === v ? '' : v;
      pintarBloque('bloque-entrega', htmlEntrega(f));
    },
    guardarPedido: function () { guardarFormPedido(false); },
    guardarIgual: function () { guardarFormPedido(true); },
    cancelarEdicion: function () {
      var volver = (E.form && E.form.volverA) || 'hoy';
      terminarEdicion();
      irA(volver);
    },
    medioVenta: function (el) {
      var f = formActual();
      f.medio = el.getAttribute('data-v');
      var botones = document.querySelectorAll('[data-a="medioVenta"]');
      for (var i = 0; i < botones.length; i++) botones[i].classList.toggle('activo', botones[i].getAttribute('data-v') === f.medio);
    },
    guardarVenta: function () { guardarVenta(false); },
    guardarVentaIgual: function () { guardarVenta(true); },
    // PENDIENTES
    reprogramar: function (el) { reprogramar(el.getAttribute('data-id'), el.getAttribute('data-v')); },
    // CIERRE
    agregarGasto: agregarGasto,
    borrarGasto: function (el) {
      accion('borrarGasto', [el.getAttribute('data-id')]);
      render();
      toast('Gasto borrado');
    },
    cerrarDia: function () { cerrarDia(false); },
    cerrarDiaIgual: function () { cerrarDia(true); }
  };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-a]') : null;
    if (!el || el.disabled) return;
    var fn = ACCIONES[el.getAttribute('data-a')];
    if (!fn) return;
    if (el.tagName !== 'A') ev.preventDefault();
    fn(el, ev);
  });

  function alEscribir(el) {
    var campo = el.getAttribute('data-campo');
    var f = formActual();
    f[campo] = el.value;
    if (campo === 'busqueda') { var r = $('resultados'); if (r) r.innerHTML = htmlResultados(f); }
    else if (campo === 'filtro') filtrarProductos(el.value);
    else if (campo === 'telefono') pintarAvisoTelefono();
    else if (campo === 'barrio') {
      var otro = porDato('data-campo', 'barrioOtro');
      if (otro) otro.style.display = el.value === '__otro' ? 'block' : 'none';
      if (el.value !== '__otro') f.barrioOtro = '';
      pintarAvisoBarrio();
    } else if (campo === 'barrioOtro') pintarAvisoBarrio();
    else if (campo === 'totalCobrado') { f.totalEditado = true; pintarTotales(f); }
    else if (campo === 'envio') pintarTotales(f);
    else if (campo === 'fechaEntrega') {
      var aviso = $('aviso-fecha');
      if (aviso) aviso.innerHTML = textoFecha(f);
      var chips = document.querySelectorAll('[data-a="fecha"]');
      for (var i = 0; i < chips.length; i++) chips[i].classList.toggle('activo', chips[i].getAttribute('data-v') === el.value);
    }
  }

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.hasAttribute('data-campo')) alEscribir(el);
    else if (el.hasAttribute('data-precio')) {
      var f = formActual();
      var codigo = el.getAttribute('data-precio');
      if (f.lineas[codigo]) f.lineas[codigo].precioManual = String(el.value).trim() === '' ? null : L.parsearPesos(el.value);
      pintarTotales(f);
    } else if (el.hasAttribute('data-gasto') && el.type !== 'checkbox') {
      E.gastoNuevo[el.getAttribute('data-gasto')] = el.value;
    } else if (el.hasAttribute('data-retiro')) {
      E.retiro = el.value;
      pintarResumenCierre();
    }
  });

  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.hasAttribute('data-campo') && el.tagName === 'SELECT') alEscribir(el);
    else if (el.hasAttribute('data-campo-check')) formActual()[el.getAttribute('data-campo-check')] = el.checked;
    else if (el.hasAttribute('data-gasto') && el.type === 'checkbox') E.gastoNuevo.noAfecta = el.checked;
    else if (el.hasAttribute('data-reprogramar')) reprogramar(el.getAttribute('data-reprogramar'), el.value);
    else if (el.hasAttribute('data-cierre-fecha')) { E.cierreFecha = el.value || hoy(); render(); }
  });

  $('panel').addEventListener('click', function (ev) { if (ev.target.id === 'panel') cerrarPanel(); });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { E.ocultoDesde = Date.now(); return; }
    if (E.datos && E.ocultoDesde && Date.now() - E.ocultoDesde > 3 * 60 * 1000) refrescar(true);
    pintarMarca();
    procesarCola();
  });

  window.addEventListener('online', function () {
    E.cola.forEach(function (o) { o.trabada = false; o.intentos = 0; });
    E.esperaHasta = 0;
    procesarCola();
  });

  // ───────────────────────────── Arranque ─────────────────────────────

  function mostrarErrorInicial(msg) {
    $('pantalla').innerHTML = '<div class="bloque"><h2>No pude cargar los datos</h2><div class="aviso rojo">' + esc(msg || 'Error desconocido') + '</div>' +
      '<p class="ayuda">Si es la primera vez, abrí la planilla y corré Avícola → Instalar.</p>' +
      '<button class="btn primario" data-a="refrescar">Reintentar</button></div>';
  }

  function iniciar() {
    E.cola = (leerLocal(CLAVE_COLA) || []).filter(function (o) { return o && o.persistir && o.tipo; });
    var pestana = leerLocal(CLAVE_PESTANA);
    if (pestana && ['hoy', 'nuevo', 'ruta', 'pendientes', 'cierre'].indexOf(pestana) >= 0) E.pestana = pestana;
    if (ERROR_INICIAL || !DATOS_INICIALES) {
      mostrarErrorInicial(ERROR_INICIAL);
      return;
    }
    E.datos = prepararDatos(DATOS_INICIALES);
    reaplicarCola();
    pintarMarca();
    render();
    pintarEstadoGuardado();
    procesarCola();
    pedirAvisos();
  }

  iniciar();
})();
</script>
</body>
</html>
